<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12365A" />
      <stop offset="100%" stop-color="#086B9B" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#D4AF37" stroke-width="6" opacity="0.6" />
  
  <!-- Islamic 8-point geometric star -->
  <g opacity="0.18" fill="none" stroke="#FFFFFF" stroke-width="8">
    <rect x="156" y="156" width="200" height="200" rx="16" />
    <rect x="156" y="156" width="200" height="200" rx="16" transform="rotate(45 256 256)" />
  </g>

  <!-- Open Book & Beams of Divine Knowledge -->
  <path d="M256 180 L380 130 V290 L256 340 V180 Z" fill="url(#gold)" opacity="0.95" />
  <path d="M256 180 L132 130 V290 L256 340 V180 Z" fill="#FFFFFF" opacity="0.9" />
  <line x1="256" y1="170" x2="256" y2="346" stroke="#12365A" stroke-width="12" stroke-linecap="round" />

  <!-- Monogram KIQS -->
  <text x="256" y="420" fill="#FFFFFF" font-size="76" font-weight="900" letter-spacing="10" text-anchor="middle" font-family="system-ui, sans-serif">
    KIQS
  </text>
  
  <!-- Branch 86 Gold Badge -->
  <circle cx="410" cy="102" r="50" fill="#D4AF37" stroke="#FFFFFF" stroke-width="4" />
  <text x="410" y="118" fill="#12365A" font-size="38" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">
    86
  </text>
</svg>
